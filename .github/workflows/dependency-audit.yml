name: Python dependency audit

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/dependabot.yml
      - .github/workflows/dependency-audit.yml
  pull_request:
    paths:
      - pyproject.toml
      - .github/dependabot.yml
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit resolved Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install FUSE development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check installed packages for known vulnerabilities
        run: python -m pip_audit --skip-editable --timeout 45
