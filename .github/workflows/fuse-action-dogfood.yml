name: FUSE Action dogfood
on:
  push:
    branches: [feat/fuse-github-action]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Test adapter against real FUSE
        run: PYTHONPATH=src python -m pytest -q tests/test_github_action.py
      - name: Run Action on FUSE
        uses: ./
        with:
          fail-on: none
          network: offline
          artifact-upload: 'true'
  sarif:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise Code Scanning upload
        uses: ./
        with:
          fail-on: none
          artifact-upload: 'false'
          sarif-upload: 'true'
