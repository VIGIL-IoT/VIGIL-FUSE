name: Pinned repository performance

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: repository-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Cohort scan on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      GIT_TERMINAL_PROMPT: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out FUSE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        run: python -m pip install "jsonschema>=4.23,<5" "psutil>=7.2,<8"
      - name: Install FUSE package
        run: python -m pip install -e .
      - name: Prepare clean pinned repository checkouts
        shell: bash
        run: >-
          python scripts/prepare_repository_benchmark_cohort.py
          --manifest reports/repository-scans/fresh-validation-next/manifest.json
          --checkouts "$RUNNER_TEMP/fuse-repository-cohort"
          --timeout-seconds 1200
      - name: Measure pinned repository scopes
        shell: bash
        run: >-
          python scripts/benchmark_repository_cohort.py
          --manifest reports/repository-scans/fresh-validation-next/manifest.json
          --checkouts "$RUNNER_TEMP/fuse-repository-cohort"
          --warmups 1
          --repetitions 3
          --sample-interval-ms 20
          --timeout-seconds 150
          --output "$RUNNER_TEMP/fuse-repository-performance.json"
      - name: Validate benchmark report schema
        shell: bash
        run: >-
          python -c 'import json, os; from jsonschema import Draft202012Validator, FormatChecker;
          from pathlib import Path; report=json.loads((Path(os.environ["RUNNER_TEMP"]) /
          "fuse-repository-performance.json").read_text(encoding="utf-8"));
          schema=json.loads(Path("reports/benchmark/repository-scan-performance.schema.json").read_text(encoding="utf-8"));
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(report);
          assert len(report["scopes"]) == 4;
          assert report["configuration"]["network_enabled"] is False;
          assert report["configuration"]["memory_sampling_enabled"] is True;
          assert all(scope["process_tree_rss_bytes"]["sampling_complete"] for scope in report["scopes"]);
          assert any(report["environment"]["operating_system"] in item for item in report["scope_limitations"]);
          print("Pinned repository performance report is schema-valid")'
      - name: Upload measured report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-performance-${{ matrix.os }}
          path: ${{ runner.temp }}/fuse-repository-performance.json
          if-no-files-found: error
          retention-days: 30
