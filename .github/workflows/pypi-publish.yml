name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vigil-fuse/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and validate distributions
        run: |
          python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
          python -m build
          python -m twine check dist/*
      - name: Verify distribution version matches release tag
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          expected = f"vigil_fuse-{os.environ['GITHUB_REF_NAME'].removeprefix('v')}"
          artifacts = list(Path("dist").iterdir())
          assert len(artifacts) == 2
          assert all(path.name.startswith(expected) for path in artifacts)
          PY
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
