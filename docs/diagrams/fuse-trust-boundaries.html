<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1111">
  <title>FUSE trust boundaries</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --paper: #0d1111;
      --paper-2: #151a1a;
      --ink: #f2f4f1;
      --muted: #a0aaa5;
      --soft: #89938e;
      --rule: rgba(218, 238, 231, .16);
      --rule-strong: rgba(218, 238, 231, .28);
      --accent: #ff8a83;
      --accent-tint: rgba(217, 43, 33, .12);
      --font-sans: "DM Sans", "Segoe UI", sans-serif;
      --font-display: "Manrope", "DM Sans", sans-serif;
      --font-mono: "DM Mono", "DM Sans", monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --paper: #ffffff;
        --paper-2: #f2f2f2;
        --ink: #0a0a0a;
        --muted: #4a4a4a;
        --soft: #5c5c5c;
        --rule: rgba(10, 10, 10, .14);
        --rule-strong: rgba(10, 10, 10, .24);
        --accent: #b91e16;
        --accent-tint: rgba(217, 43, 33, .06);
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 24px 48px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    .frame {
      width: min(1360px, 100%);
      margin-inline: auto;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 900px;
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(30px, 4vw, 44px);
      font-weight: 700;
      letter-spacing: -.045em;
      line-height: 1.08;
    }
    .intro {
      max-width: 760px;
      margin: 14px 0 26px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }
    .diagram-container {
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-color: var(--muted) var(--paper-2);
      scrollbar-width: thin;
    }
    svg {
      display: block;
      width: 100%;
      min-width: 1280px;
      height: auto;
    }
    figcaption {
      max-width: 1020px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }
    figcaption a {
      color: inherit;
      text-decoration-color: var(--accent);
      text-underline-offset: 3px;
    }
    @media print {
      body { padding: 16px; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">FUSE / Security boundaries</p>
    <h1>How FUSE handles untrusted project input</h1>
    <p class="intro">A local scan reads selected files as data. Optional analyzer isolation depends on the runtime you choose.</p>
    <figure>
      <div class="diagram-container">

          <title id="fuse-trust-boundaries-title">FUSE trust boundaries</title>
          <desc id="fuse-trust-boundaries-desc">FUSE reads a selected project through bounded discovery and native rules, then records findings and local reports. Optional tools run on the host by default or in an explicitly configured Docker sandbox.</desc>

            <marker id="fuse-trust-boundaries-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/>
            </marker>
            <marker id="fuse-trust-boundaries-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/>
            </marker>
            <style>

                  --ink: #0a0a0a;
                  --muted: #4a4a4a;
                  --soft: #5c5c5c;
                  --rule: rgba(10, 10, 10, .14);

              #fuse-trust-boundaries-root .zone {

                stroke-width: 1.2;
              }
              #fuse-trust-boundaries-root .zone-input { stroke-dasharray: 5 4; }

                stroke: var(--muted);
                stroke-width: 1.2;
                stroke-dasharray: 5 4;
                marker-end: url(#fuse-trust-boundaries-arrow);
              }
              #fuse-trust-boundaries-root .node-box {
                fill: var(--paper);
                stroke: var(--rule-strong);
                stroke-width: 1;
              }
              #fuse-trust-boundaries-root .input .node-box {
                fill: var(--paper-2);
                stroke-dasharray: 4 3;
              }
              #fuse-trust-boundaries-root .focal .node-box {
                fill: var(--accent-tint);
                stroke: var(--accent);
              }
              #fuse-trust-boundaries-root .node-tag-box {
                fill: none;
                stroke: var(--rule-strong);
                stroke-width: .8;
              }
              #fuse-trust-boundaries-root .focal .node-tag-box {
                stroke: var(--accent);
              }
              #fuse-trust-boundaries-root .node-tag {
                fill: var(--soft);
                font: 500 7px var(--font-mono);
                letter-spacing: .08em;
              }
              #fuse-trust-boundaries-root .focal .node-tag {
                fill: var(--accent);
              }
              #fuse-trust-boundaries-root .node-title {
                fill: var(--ink);
                font: 600 12px var(--font-sans);
                letter-spacing: -.01em;
              }
              #fuse-trust-boundaries-root .node-detail {
                fill: var(--muted);
                font: 400 9px var(--font-mono);
              }
              #fuse-trust-boundaries-root .legend-rule {
                stroke: var(--rule);
                stroke-width: 1;
              }
              #fuse-trust-boundaries-root .legend-label {
                fill: var(--soft);
                font: 500 8px var(--font-mono);
                letter-spacing: .1em;
              }
              #fuse-trust-boundaries-root .legend-copy {
                fill: var(--muted);
                font: 400 9px var(--font-sans);
              }
            </style>

            <rect class="node-tag-box" x="338" y="246" width="38" height="14" rx="2"/>

            <text class="node-detail" x="610" y="293" text-anchor="middle">selected text + metadata</text>
          </g>

          <g class="node">
            <rect class="node-box" x="525" y="400" width="170" height="78" rx="6"/>

            <text class="node-tag" x="556" y="420" text-anchor="middle">RULES</text>

            <text class="node-detail" x="815" y="285" text-anchor="middle">Syft / OSV-Scanner</text>

            <text class="legend-copy" x="430" y="660">optional analyzer path</text>
            <rect class="zone zone-input" x="654" y="647" width="38" height="18" rx="3"/>
            <text class="legend-copy" x="704" y="660">trust boundary</text>
          </g>
        </svg>
      </div>
      <figcaption>
        FUSE treats project files as data and does not execute scanned code or firmware. Native rules have per-input timeouts, but their worker is not an operating-system sandbox. Optional analyzers run on the host by default with the current user's privileges. Explicit Docker mode uses digest-pinned local images, read-only input and root filesystems, bounded output and resource limits, and no network by default. OSV network access requires an explicit option. See the <a href="../threat-model.md">threat model</a> for runtime details and residual risks.
      </figcaption>
    </figure>
  </main>
</body>
</html>
