name: Binwalk adapter integration

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: binwalk-adapter-${{ github.ref }}
  cancel-in-progress: false

env:
  BINWALK_SOURCE_COMMIT: 4fdab3d464d97b68e0af9088df3f9e2e1545b21c
  CARGO_TERM_COLOR: always
  TASMOTA_FIRMWARE_URL: https://github.com/arendst/Tasmota/releases/download/v16.0.0/tasmota-4M.bin.gz
  TASMOTA_FIRMWARE_SHA256: 15a8e568af5096c9f43efd636da534214f2d170faf6551b4a9e9b6182117766c
  OPENWRT_UIMAGE_URL: https://downloads.openwrt.org/releases/25.12.6/targets/malta/be/openwrt-25.12.6-malta-be-uImage-gzip
  OPENWRT_UIMAGE_SHA256: 561db5bcecc5ff73d7fb2c18fe1b1d95708ea813ccdb3559db7634133bc9d1cf
  OPENWRT_SQUASHFS_URL: https://downloads.openwrt.org/releases/25.12.6/targets/malta/be/openwrt-25.12.6-malta-be-rootfs-squashfs.img.gz
  OPENWRT_SQUASHFS_SHA256: b285ce3b64377db55507ccce276881252e125039794f953d0f4d0f054775aafa
  OPENWRT_EXT4_URL: https://downloads.openwrt.org/releases/25.12.6/targets/malta/be/openwrt-25.12.6-malta-be-rootfs-ext4.img.gz
  OPENWRT_EXT4_SHA256: 8e6979b0024018e31fe5a8fe71be2a253c2cc2b6ae9991071e6fadcabfd91044
  OPENWRT_MT7621_INITRAMFS_URL: https://downloads.openwrt.org/releases/25.12.6/targets/ramips/mt7621/openwrt-25.12.6-ramips-mt7621-mediatek_mt7621-eval-board-initramfs-kernel.bin
  OPENWRT_MT7621_INITRAMFS_SHA256: 503bf12e6b8dce51102ada7219ba38f85cfe75dcc6b50610a4b434b412eae3ee
  OPENWRT_MT7621_SYSUPGRADE_URL: https://downloads.openwrt.org/releases/25.12.6/targets/ramips/mt7621/openwrt-25.12.6-ramips-mt7621-mediatek_mt7621-eval-board-squashfs-sysupgrade.bin
  OPENWRT_MT7621_SYSUPGRADE_SHA256: 20cbe57eb177b1eda050e470fe4bc0fc2ee744f523b99f09fbe34dd7bd42ba1d

jobs:
  adapter-smoke:
    name: Binwalk v3.1.0 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out FUSE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust 1.89.0
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.89.0
          rustflags: ""
          cache: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install FUSE
        run: python -m pip install .
      - name: Install Ubuntu Binwalk build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libfontconfig1-dev liblzma-dev
      - name: Build pinned Binwalk and scan synthetic plus real firmware on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source_dir="$RUNNER_TEMP/binwalk-source"
          firmware_sample="$RUNNER_TEMP/tasmota-4M.bin.gz"
          uimage_sample="$RUNNER_TEMP/openwrt-malta-be-uImage-gzip"
          filesystem_archive="$RUNNER_TEMP/openwrt-malta-rootfs-squashfs.img.gz"
          ext4_archive="$RUNNER_TEMP/openwrt-malta-rootfs-ext4.img.gz"
          mt7621_kernel="$RUNNER_TEMP/openwrt-mt7621-initramfs-kernel.bin"
          mt7621_sysupgrade="$RUNNER_TEMP/openwrt-mt7621-squashfs-sysupgrade.bin"
          git clone --no-checkout https://github.com/ReFirmLabs/binwalk.git "$source_dir"
          git -C "$source_dir" checkout --detach "$BINWALK_SOURCE_COMMIT"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$BINWALK_SOURCE_COMMIT"
          cargo build --release --locked --manifest-path "$source_dir/Cargo.toml"
          curl --fail --location --silent --show-error \
            "$TASMOTA_FIRMWARE_URL" --output "$firmware_sample"
          curl --fail --location --silent --show-error \
            "$OPENWRT_UIMAGE_URL" --output "$uimage_sample"
          curl --fail --location --silent --show-error \
            "$OPENWRT_SQUASHFS_URL" --output "$filesystem_archive"
          curl --fail --location --silent --show-error \
            "$OPENWRT_EXT4_URL" --output "$ext4_archive"
          curl --fail --location --silent --show-error \
            "$OPENWRT_MT7621_INITRAMFS_URL" --output "$mt7621_kernel"
          curl --fail --location --silent --show-error \
            "$OPENWRT_MT7621_SYSUPGRADE_URL" --output "$mt7621_sysupgrade"
          python scripts/verify_binwalk_adapter.py \
            --expected-version 3.1.0 \
            --binwalk-executable "$source_dir/target/release/binwalk" \
            --real-firmware "$firmware_sample" "$TASMOTA_FIRMWARE_SHA256" gzip \
            --real-firmware "$uimage_sample" "$OPENWRT_UIMAGE_SHA256" "uImage firmware image" \
            --real-filesystem "$filesystem_archive" "$OPENWRT_SQUASHFS_SHA256" "SquashFS file system" \
            --real-filesystem "$ext4_archive" "$OPENWRT_EXT4_SHA256" "EXT filesystem" \
            --real-firmware "$mt7621_kernel" "$OPENWRT_MT7621_INITRAMFS_SHA256" "uImage firmware image" \
            --real-firmware "$mt7621_sysupgrade" "$OPENWRT_MT7621_SYSUPGRADE_SHA256" "SquashFS file system"
      - name: Build pinned Binwalk and scan synthetic plus real firmware on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:RUNNER_TEMP 'binwalk-source'
          $firmwareSample = Join-Path $env:RUNNER_TEMP 'tasmota-4M.bin.gz'
          $uimageSample = Join-Path $env:RUNNER_TEMP 'openwrt-malta-be-uImage-gzip'
          $filesystemArchive = Join-Path $env:RUNNER_TEMP 'openwrt-malta-rootfs-squashfs.img.gz'
          $ext4Archive = Join-Path $env:RUNNER_TEMP 'openwrt-malta-rootfs-ext4.img.gz'
          $mt7621Kernel = Join-Path $env:RUNNER_TEMP 'openwrt-mt7621-initramfs-kernel.bin'
          $mt7621Sysupgrade = Join-Path $env:RUNNER_TEMP 'openwrt-mt7621-squashfs-sysupgrade.bin'
          git clone --no-checkout https://github.com/ReFirmLabs/binwalk.git $sourceDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone pinned Binwalk source.' }
          git -C $sourceDir checkout --detach $env:BINWALK_SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out pinned Binwalk source.' }
          $actualCommit = git -C $sourceDir rev-parse HEAD
          if ($actualCommit -ne $env:BINWALK_SOURCE_COMMIT) { throw 'Binwalk source commit did not match the pinned revision.' }
          cargo build --release --locked --manifest-path (Join-Path $sourceDir 'Cargo.toml')
          if ($LASTEXITCODE -ne 0) { throw 'Could not build pinned Binwalk source.' }
          $binwalk = Join-Path $sourceDir 'target\release\binwalk.exe'
          Invoke-WebRequest -Uri $env:TASMOTA_FIRMWARE_URL -OutFile $firmwareSample
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned Tasmota firmware sample.' }
          Invoke-WebRequest -Uri $env:OPENWRT_UIMAGE_URL -OutFile $uimageSample
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned OpenWrt uImage sample.' }
          Invoke-WebRequest -Uri $env:OPENWRT_SQUASHFS_URL -OutFile $filesystemArchive
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned OpenWrt filesystem sample.' }
          Invoke-WebRequest -Uri $env:OPENWRT_EXT4_URL -OutFile $ext4Archive
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned OpenWrt ext4 filesystem sample.' }
          Invoke-WebRequest -Uri $env:OPENWRT_MT7621_INITRAMFS_URL -OutFile $mt7621Kernel
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned OpenWrt MT7621 initramfs kernel sample.' }
          Invoke-WebRequest -Uri $env:OPENWRT_MT7621_SYSUPGRADE_URL -OutFile $mt7621Sysupgrade
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned OpenWrt MT7621 sysupgrade sample.' }
          python scripts/verify_binwalk_adapter.py `
            --expected-version 3.1.0 `
            --binwalk-executable $binwalk `
            --real-firmware $firmwareSample $env:TASMOTA_FIRMWARE_SHA256 gzip `
            --real-firmware $uimageSample $env:OPENWRT_UIMAGE_SHA256 'uImage firmware image' `
            --real-filesystem $filesystemArchive $env:OPENWRT_SQUASHFS_SHA256 'SquashFS file system' `
            --real-filesystem $ext4Archive $env:OPENWRT_EXT4_SHA256 'EXT filesystem' `
            --real-firmware $mt7621Kernel $env:OPENWRT_MT7621_INITRAMFS_SHA256 'uImage firmware image' `
            --real-firmware $mt7621Sysupgrade $env:OPENWRT_MT7621_SYSUPGRADE_SHA256 'SquashFS file system'
          if ($LASTEXITCODE -ne 0) { throw 'Binwalk adapter verification failed.' }
