name: Go operator
on:
  push:
    paths: ['cluster/fuse-operator/**', '.github/workflows/go-operator.yml']
  pull_request:
    paths: ['cluster/fuse-operator/**', '.github/workflows/go-operator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cluster/fuse-operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: cluster/fuse-operator/go.mod
          cache: false
      - run: go mod tidy
      - run: gofmt -w cmd internal
      - run: git diff --exit-code -- go.mod go.sum cmd internal
      - run: go test ./...
      - run: go vet ./...
