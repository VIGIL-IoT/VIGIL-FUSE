<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 442" role="img" aria-labelledby="title desc">
<title id="title">Raw FUSE signals by repository</title>
<desc id="desc">Horizontal bars show raw FUSE signal counts. Bar lengths use a logarithmic scale; exact values appear at the right.</desc>
<style>text{font-family:Arial,sans-serif;fill:#161616}.axis{fill:#595959;font-size:12px}.label{font-size:14px}.value{font-size:14px;font-weight:700}.grid{stroke:#dedede;stroke-width:1}.track{fill:#eeeeee}.bar{fill:#d92b21}</style>
<text x="0" y="24" font-size="18" font-weight="700">Raw FUSE signals by repository</text>
<text x="0" y="45" class="axis">Log scale for bar length, exact count shown</text>
<line x1="340.0" y1="50" x2="340.0" y2="390" class="grid"/>
<text x="340.0" y="430" text-anchor="middle" class="axis">0</text>
<line x1="398.3" y1="50" x2="398.3" y2="390" class="grid"/>
<text x="398.3" y="430" text-anchor="middle" class="axis">1</text>
<line x1="541.6" y1="50" x2="541.6" y2="390" class="grid"/>
<text x="541.6" y="430" text-anchor="middle" class="axis">10</text>
<line x1="728.1" y1="50" x2="728.1" y2="390" class="grid"/>
<text x="728.1" y="430" text-anchor="middle" class="axis">100</text>
<line x1="920.9" y1="50" x2="920.9" y2="390" class="grid"/>
<text x="920.9" y="430" text-anchor="middle" class="axis">1000</text>
<line x1="960.0" y1="50" x2="960.0" y2="390" class="grid"/>
<text x="960.0" y="430" text-anchor="middle" class="axis">1592</text>
<text x="0" y="79" class="label">arendst/Tasmota</text>
