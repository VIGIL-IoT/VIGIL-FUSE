[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-fuse"
version = "0.2.0"
description = "FUSE, the Firmware & Unified Security Engine, a VIGIL Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "LicenseRef-VIGIL-FUSE-Restricted-Use-1.0"
license-files = ["LICENSE"]
keywords = ["embedded security", "firmware analysis", "IoT", "static analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
esp-idf = ["PyYAML>=6,<7"]
test = ["jsonschema>=4.23,<5", "pytest>=8,<9", "PyYAML>=6,<7"]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "twine>=6,<7",
]

[project.urls]
Repository = "https://github.com/VIGIL-IoT/VIGIL-FUSE"
Issues = "https://github.com/VIGIL-IoT/VIGIL-FUSE/issues"

[project.scripts]
vigil-fuse = "vigil_fuse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vigil_fuse = ["schemas/*.json", "support-matrix.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["vigil_fuse"]

[tool.coverage.report]
show_missing = true
skip_covered = true
