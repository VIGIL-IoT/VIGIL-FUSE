name: candidate script interpolation
on: pull_request
permissions:
  contents: read
jobs:
  title-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check issue title
        run: echo "${{ github.event.issue.title }}"
      - name: Check pull request title
        run: |
          title="${{ github.event.pull_request.title }}"
          printf '%s\n' "$title"
      - name: Place an event body in a shell comment
        run: |
          # ${{ github.event.issue.body }}
          printf '%s\n' "reviewed"
