<line x1="960.0" y1="50" x2="960.0" y2="348" class="grid"/>
<text x="960.0" y="388" text-anchor="middle" class="axis">1422</text>
<text x="0" y="79" class="label">FUSE001</text>
<rect x="340" y="62" width="620" height="22" class="track"/>
<rect x="340" y="62" width="460.2" height="22" class="bar"/>
<text x="974" y="79" class="value">218</text>
