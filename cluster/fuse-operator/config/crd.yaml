apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fusescans.fuse.vigil.dev
spec:
  group: fuse.vigil.dev
  scope: Namespaced
  names:
    plural: fusescans
    singular: fusescan
    kind: FuseScan
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - plan
            x-kubernetes-validations:
            - rule: self == oldSelf
              message: Execution plans are immutable; create a new FuseScan.
            properties:
              plan:
                type: object
                required:
                - schema_version
                - plan_id
                - target
                - requested_analyzers
                - execution_mode
                - authorization
                - limits
                - network_policy
                - evidence_requirements
                - created_by
                properties:
                  schema_version:
                    type: string
                    enum:
                    - '0.1'
                    maxLength: 128
                  plan_id:
                    type: string
                    pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                    maxLength: 128
                  target:
                    type: object
                    required:
                    - target_id
                    - sha256
                    properties:
                      target_id:
                        type: string
                        pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                        maxLength: 128
                      sha256:
                        type: string
                        pattern: ^[a-f0-9]{64}$
                        maxLength: 128
                  requested_analyzers:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: string
                      enum:
                      - probe
                      maxLength: 64
                  execution_mode:
                    enum:
                    - local
                    - docker
                    - kubernetes
                    type: string
                    maxLength: 128
                  authorization:
                    type: object
                    required:
                    - passive_execution
                    properties:
                      passive_execution:
                        type: boolean
                        enum:
                        - true
                  limits:
                    type: object
                    required:
                    - cpu_millis
                    - memory_mb
                    - timeout_seconds
                    properties:
                      cpu_millis:
                        type: integer
                        minimum: 1
                        maximum: 4000
                      memory_mb:
                        type: integer
                        minimum: 1
                        maximum: 4096
                      timeout_seconds:
                        type: integer
                        minimum: 1
                        maximum: 3600
                  network_policy:
                    type: string
                    enum:
                    - deny
                    maxLength: 128
                  evidence_requirements:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: string
                      enum:
                      - target-identity
                      maxLength: 64
                  created_by:
                    type: string
                    enum:
                    - vigil-fuse
                    maxLength: 128
          status:
            type: object
            properties:
              phase:
                type: string
                enum:
                - Pending
                - Running
                - Completed
                - Partial
                - Failed
                - Blocked
              reason:
                type: string
                maxLength: 512
              observedGeneration:
                type: integer
                format: int64
