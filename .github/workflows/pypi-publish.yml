name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vigil-fuse/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build and validate distributions
        run: |
          python -m pip install 'build>=1.2,<2' 'twine>=7,<8'
          python -m build
          python -m twine check dist/*
      - name: Verify distribution version matches release tag
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          expected = f"vigil_fuse-{os.environ['GITHUB_REF_NAME'].removeprefix('v')}"
          artifacts = list(Path("dist").iterdir())
          assert len(artifacts) == 2
          assert all(path.name.startswith(expected) for path in artifacts)
          PY
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
