name: Ghidra adapter integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ghidra-adapter.yml"
      - "pyproject.toml"
      - "src/vigil_fuse/ghidra_analyzer.py"
      - "src/vigil_fuse/resources/ghidra/**"
      - "src/vigil_fuse/schemas/ghidra-*.schema.json"
      - "src/vigil_fuse/analyzer_runtime.py"
      - "src/vigil_fuse/analyzers.py"
      - "src/vigil_fuse/config.py"
      - "src/vigil_fuse/cli.py"
      - "src/vigil_fuse/model.py"
      - "src/vigil_fuse/reporting.py"
      - "src/vigil_fuse/scanner.py"
      - "src/vigil_fuse/support.py"
      - "src/vigil_fuse/support-matrix.json"
      - "scripts/benchmark_ghidra_adapter.py"
      - "scripts/build_ghidra_late_string_fixtures.py"
      - "tests/test_ghidra_analyzer.py"
      - "tests/test_ghidra_fixture_generation.py"
      - "tests/test_ghidra_benchmark_schema.py"
  pull_request:
    paths:
      - ".github/workflows/ghidra-adapter.yml"
      - "pyproject.toml"
      - "src/vigil_fuse/ghidra_analyzer.py"
      - "src/vigil_fuse/resources/ghidra/**"
      - "src/vigil_fuse/schemas/ghidra-*.schema.json"
      - "src/vigil_fuse/analyzer_runtime.py"
      - "src/vigil_fuse/analyzers.py"
      - "src/vigil_fuse/config.py"
      - "src/vigil_fuse/cli.py"
      - "src/vigil_fuse/model.py"
      - "src/vigil_fuse/reporting.py"
      - "src/vigil_fuse/scanner.py"
      - "src/vigil_fuse/support.py"
      - "src/vigil_fuse/support-matrix.json"
      - "scripts/benchmark_ghidra_adapter.py"
      - "scripts/build_ghidra_late_string_fixtures.py"
      - "tests/test_ghidra_analyzer.py"
      - "tests/test_ghidra_fixture_generation.py"
      - "tests/test_ghidra_benchmark_schema.py"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ghidra-integration:
    name: Ghidra 12.2 on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Install FUSE test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Download and verify the official Ghidra release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ghidra_12.2_PUBLIC_20261016.zip"
          url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip"
          curl --fail --location --retry 3 "$url" --output "$archive"
          printf '%s  %s\n' "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ghidra-install"
          unzip -q "$archive" -d "$RUNNER_TEMP/ghidra-install"
          install_dir="$RUNNER_TEMP/ghidra-install/ghidra_12.2_PUBLIC"
          test -f "$install_dir/Ghidra/application.properties"
          echo "GHIDRA_INSTALL_DIR=$install_dir" >> "$GITHUB_ENV"
          java -version

      - name: Build late-string controlled ELF matrix
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fuse-ghidra-validation"
          mkdir -p "$work/source" "$work/tmp"
          python scripts/build_ghidra_late_string_fixtures.py --output-dir "$work/source"
          for kind in positive secure unreferenced; do
            for optimization in O0 O1 O2 Os; do
              if [[ "$kind" != positive && "$optimization" != O2 ]]; then
                continue
              fi
              python scripts/build_ghidra_late_string_fixtures.py --output-dir "$work/source" --kind "$kind" |
              gcc "-$optimization" -nostdlib -fno-pie -no-pie \
                -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables \
                -Wl,--build-id=none -Wl,-T,"$work/source/layout.ld" \
                -x c - -o "$work/$kind-$optimization.elf"
            done
            strip --strip-all "$work/$kind-O2.elf" -o "$work/$kind-O2-stripped.elf"
          done
          python scripts/build_ghidra_late_string_fixtures.py --output-dir "$work/source" --kind limited |
          gcc -O0 -nostdlib -fno-pie -no-pie \
            -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables \
            -Wl,--build-id=none -Wl,-T,"$work/source/layout.ld" \
            -x c - -o "$work/limited-O0.elf"

      - name: Run Ghidra and validate FUSE evidence
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fuse-ghidra-validation"
          cases=(positive-O0 positive-O1 positive-O2 positive-Os secure-O2 unreferenced-O2 limited-O0 \
            positive-O2-stripped secure-O2-stripped unreferenced-O2-stripped)
          for case in "${cases[@]}"; do
            set +e
            TMPDIR="$work/tmp" vigil-fuse scan "$work/$case.elf" \
              --ghidra \
              --ghidra-install-dir "$GHIDRA_INSTALL_DIR" \
              --ghidra-timeout-seconds 300 \
              --output-dir "$work/output-$case" \
              --format json \
              --no-network
            scan_status=$?
            set -e
            if [[ "$case" == limited-O0 ]]; then
              test "$scan_status" -eq 2
            else
              test "$scan_status" -eq 0
            fi
          done
          python - "$work" <<'PY'
          import json
          import sys
          from pathlib import Path

          from jsonschema import Draft202012Validator

          work = Path(sys.argv[1])
          package = Path("src/vigil_fuse/schemas")
          cases = (
              "positive-O0", "positive-O1", "positive-O2", "positive-Os", "secure-O2",
              "unreferenced-O2", "limited-O0", "positive-O2-stripped", "secure-O2-stripped",
              "unreferenced-O2-stripped",
          )
          report_schema = json.loads((package / "fuse-report-1.11.schema.json").read_text(encoding="utf-8"))
          artifact_schema = json.loads((package / "ghidra-analysis.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(report_schema)
          Draft202012Validator.check_schema(artifact_schema)
          expected_artifacts = {
              "findings.json",
              "findings.txt",
              "findings.sarif",
              "ghidra-analysis.json",
          }
          for case in cases:
              output = work / f"output-{case}"
              report = json.loads((output / "findings.json").read_text(encoding="utf-8"))
              artifact_path = output / "ghidra-analysis.json"
              artifact = json.loads(artifact_path.read_text(encoding="utf-8"))
              Draft202012Validator(report_schema).validate(report)
              Draft202012Validator(artifact_schema).validate(artifact)
              analyzers = {item["name"]: item for item in report["coverage"]["analyzers"]}
              expected_status = "partial" if case == "limited-O0" else "completed"
              assert analyzers["ghidra"]["status"] == expected_status, (case, analyzers["ghidra"])
              assert artifact["tool"]["version"] == "12.2"
              assert artifact["analysis"]["language_id"]
              assert artifact["strings"]["reported"] == 1024
              assert artifact["strings"]["truncated"]
              assert artifact["cross_references"]["truncated"]
              assert artifact["inventory"]["status"] == "partial"
              security = artifact["security_evaluation"]
              expected_security_status = "partial" if case == "limited-O0" else "complete"
              assert security["status"] == expected_security_status, (case, security)
              assert security["data_items_scanned"] > 1500, (case, security)
              if case == "limited-O0":
                  http = security["rules"]["FUSE-BIN-001"]
                  mqtt = security["rules"]["FUSE-BIN-002"]
                  assert http["status"] == "partial" and http["truncated"]
                  assert http["reported"] == artifact["limits"]["max_security_references_per_rule"]
                  assert http["observed"] > http["reported"]
                  assert not http["observed_is_lower_bound"]
                  assert mqtt["status"] == "complete"
              else:
                  assert all(rule["status"] == "complete" for rule in security["rules"].values())
              positive = case.startswith("positive-") or case == "limited-O0"
              expected = {"FUSE-BIN-001", "FUSE-BIN-002"} if positive else set()
              rule_ids = {item["rule_id"] for item in report["findings"]}
              assert rule_ids == expected, (case, rule_ids, expected)
              assert {path.name for path in output.iterdir()} == expected_artifacts
              serialized = "\n".join(
                  path.read_text(encoding="utf-8") for path in output.iterdir() if path.is_file()
              )
              for sentinel in ("fixture-user", "sentinel-password", "sentinel-query-value"):
                  assert sentinel not in serialized, (case, sentinel)
              if positive:
                  inventory_addresses = {
                      record["address"] for record in artifact["strings"]["records"]
                  }
                  evidence_addresses = {
                      record["string_address"]
                      for rule in security["rules"].values()
                      for record in rule["records"]
                  }
                  assert evidence_addresses.isdisjoint(inventory_addresses), (case, evidence_addresses)
                  assert all(
                      int(address.split(":")[-1], 16) > max(
                          int(item.split(":")[-1], 16) for item in inventory_addresses
                      )
                      for address in evidence_addresses
                  ), case
          assert list((work / "tmp").iterdir()) == [], "Ghidra temporary workspace was not removed"
          print("Ghidra integration passed: late HTTP/MQTT, HTTPS/MQTTS, unreferenced, optimization, stripped, bounds, redaction, schemas, and cleanup.")
          PY
